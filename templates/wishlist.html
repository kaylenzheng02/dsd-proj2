<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoes I Want | Kaylen Zheng</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-brand" href="{{ url_for('home') }}">Kaylen Zheng</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">My Collection</a>
        <a href="{{ url_for('wishlist') }}" aria-current="page">Shoes I Want</a>
      </div>
    </nav>
    <header>
      <p class="eyebrow">The wish list</p>
      <h1>Shoes I want</h1>
      <p class="intro">A few pairs I'm hoping to add to my collection.</p>
      <p class="count">{{ shoes|length }} pairs on my list</p>
    </header>
    <section aria-labelledby="wishlist-heading">
      <h2 id="wishlist-heading">On my wish list</h2>
      <ul class="collection">
        {% for shoe in shoes %}
        <li>
          <article class="wishlist-card">
            <div class="photo-panel">
              <img src="{{ url_for('static', filename=shoe['image']) }}" alt="{{ shoe['brand'] }} {{ shoe['style'] }} in {{ shoe['colorway'] }}">
            </div>
            <div class="details">
              <p class="eyebrow">{{ shoe["brand"] }}</p>
              <h3 class="shoe-title">{{ shoe["style"] }}</h3>
              <p>{{ shoe["colorway"] }}</p>
            </div>
          </article>
        </li>
        {% endfor %}
      </ul>
    </section>
  </main>
</body>
</html>
