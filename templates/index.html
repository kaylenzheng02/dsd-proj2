<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shoe inventory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-brand" href="{{ url_for('home') }}">Kaylen Zheng</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}" aria-current="page">my collection</a>
        <a href="{{ url_for('wishlist') }}">shoes i want</a>
      </div>
    </nav>
    <header>
      <h1>shoe inventory</h1>
      <p class="intro">here is a list of the shoes that i currently wear.</p>
      <p class="count">{{ shoes|length }} pairs in my collection</p>
    </header>

    <section aria-labelledby="collection-heading">
      <h2 id="collection-heading">my collection</h2>
      <ul class="collection">
        {% for shoe in shoes %}
        <li>
          <button class="shoe-card" type="button"
                  data-shoe-id="{{ loop.index0 }}"
                  data-brand="{{ shoe['brand'] }}"
                  data-style="{{ shoe['style'] }}"
                  data-colorway="{{ shoe['colorway'] }}"
                  data-image="{{ url_for('static', filename=shoe['image']) }}"
                  data-material="{{ shoe.get('material', '') }}">
            <span class="photo-panel">
              <img src="{{ url_for('static', filename=shoe['image']) }}" alt="">
            </span>
            <span class="details">
              <span class="eyebrow">{{ shoe["brand"] }}</span>
              <span class="shoe-title">{{ shoe["style"] }}</span>
              <span>{{ shoe["colorway"] }}</span>
              {% if shoe.get("material") %}
              <span class="material">{{ shoe["material"] }}</span>
              {% endif %}
              <span class="rating-summary" aria-live="polite"></span>
            </span>
          </button>
        </li>
        {% endfor %}
      </ul>
    </section>
  </main>
  <dialog class="rating-dialog" id="shoe-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content">
      <button class="dialog-close" type="button" aria-label="Close rating dialog">&times;</button>
      <img class="dialog-image" id="dialog-image" alt="">
      <p class="eyebrow" id="dialog-brand"></p>
      <h2 id="dialog-title"></h2>
      <p class="dialog-colorway" id="dialog-colorway"></p>
      <p class="material" id="dialog-material"></p>
      <fieldset class="rating-picker">
        <legend>your rating</legend>
        <div class="rating-stars" id="rating-stars">
          {% for rating in range(1, 6) %}
          <button class="rating-star" type="button" data-rating="{{ rating }}" aria-label="{{ rating }} out of 5 stars" aria-pressed="false">&#9733;</button>
          {% endfor %}
        </div>
      </fieldset>
      <p class="rating-status" id="rating-status" aria-live="polite"></p>
    </div>
  </dialog>
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
