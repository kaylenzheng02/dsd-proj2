<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onitsuka Tiger</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <p>kaylen zheng</p>
      <h1>shoe inventory</h1>
      <p>
        here is a list of the shoes that i currently wear
      </p>
    </header>

    <section aria-labelledby="styles-heading">
      <h2 id="styles-heading">Signature styles</h2>
      <p>Explore a few well-known Onitsuka Tiger silhouettes:</p>
      <ul>
        {% for model in models %}
        <li>
          <h3>{{ model["name"] }}</h3>
          <p>{{ model["description"] }}</p>
        </li>
        {% endfor %}
      </ul>
    </section>
  </main>
</body>
</html>
