<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bird Image Pair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <p>Bird photos from iNaturalist</p>
      <h1>Pick a bird… any bird</h1>
      <p id="status" role="status" aria-live="polite"></p>
      <section class="pair" aria-label="Choose your favorite bird photo">
        <article class="card">
          <img id="image-1" alt="" hidden>
          <p id="placeholder-1">Loading image…</p>
          <h2 id="title-1">Loading…</h2>
          <button type="button" data-option="1" disabled>Option 1</button>
        </article>
        <article class="card">
          <img id="image-2" alt="" hidden>
          <p id="placeholder-2">Loading image…</p>
          <h2 id="title-2">Loading…</h2>
          <button type="button" data-option="2" disabled>Option 2</button>
        </article>
      </section>
      <p>Bird observations and photos provided by <a href="https://www.inaturalist.org/" target="_blank" rel="noreferrer">iNaturalist</a>.</p>
    </main>
    <script>
      const status = document.getElementById("status");
      const buttons = [...document.querySelectorAll("button[data-option]")];
      let currentPair = [];

      async function loadPair() {
        status.textContent = "";
        buttons.forEach((button) => { button.disabled = true; });
        [1, 2].forEach((number) => {
          document.getElementById(`image-${number}`).hidden = true;
          document.getElementById(`placeholder-${number}`).hidden = false;
          document.getElementById(`placeholder-${number}`).textContent = "Loading image…";
          document.getElementById(`title-${number}`).textContent = "Loading…";
        });

        try {
          const response = await fetch("/api/images");
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not load bird photos.");
          currentPair = result.images;
          currentPair.forEach((image, index) => {
            const number = index + 1;
            const element = document.getElementById(`image-${number}`);
            element.src = image.image_url;
            element.alt = image.title;
            element.hidden = false;
            document.getElementById(`placeholder-${number}`).hidden = true;
            document.getElementById(`title-${number}`).textContent = image.title;
          });
          buttons.forEach((button) => { button.disabled = false; });
        } catch (error) {
          status.textContent = `${error.message} Please try again.`;
          [1, 2].forEach((number) => {
            document.getElementById(`placeholder-${number}`).textContent = "Image unavailable";
          });
        }
      }

      async function castVote(option) {
        buttons.forEach((button) => { button.disabled = true; });
        status.textContent = "Recording your choice…";
        try {
          const response = await fetch("/api/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              option,
              titles: currentPair.map((image) => image.title),
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not record your choice.");
          await loadPair();
        } catch (error) {
          status.textContent = `${error.message} Please try again.`;
          buttons.forEach((button) => { button.disabled = false; });
        }
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => castVote(Number(button.dataset.option)));
      });
      loadPair();
    </script>
  </body>
</html>
